# Zipherscan local stack: Postgres + API + web, reading QED-it's ZSA testnet
# node (rpc.test-zsa.org). The Rust indexer lives in the adjacent
# cipherscan-rust repository; its committed schema and migrations are mounted
# here so local services use the same database contract as production.
# See docs/run-locally.md.
#
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up -d --build
#
# Set ZEBRA_RPC_URL in .env.docker to use a different ZSA node, e.g. a local
# zebrad on http://host.docker.internal:18232.

name: zipherscan

services:
  # ----- PostgreSQL (explorer database) -----
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-local-only}
      POSTGRES_DB: ${DB_NAME:-zcash_explorer}
      APP_DB_USER: ${DB_USER:-zcash_user}
      APP_DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro
      - ${CIPHERSCAN_RUST_DIR:-../cipherscan-rust}/schema/postgres.sql:/docker-entrypoint-initdb.d/002-cipherscan-schema.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zcash_user} -d ${DB_NAME:-zcash_explorer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zipherscan]

  # Apply migrations after both a fresh snapshot restore and existing-volume
  # startup. The migration runner is idempotent and records applied versions.
  migrate:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-zcash_explorer}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-local-only}
    volumes:
      - ${CIPHERSCAN_RUST_DIR:-../cipherscan-rust}:/workspace/cipherscan-rust:ro
    command:
      - bash
      - -ceu
      - |
        export DATABASE_URL="postgresql://$${PGUSER}@$${PGHOST}:$${PGPORT}/$${PGDATABASE}"
        bash /workspace/cipherscan-rust/deploy/apply-migrations.sh
    networks: [zipherscan]

  # ----- Express API backend -----
  api:
    image: ${API_IMAGE:-zipherscan-api:local}
    build:
      context: .
      dockerfile: server/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.14.0-bookworm-slim}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3001"
      NETWORK: testnet
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-zcash_explorer}
      DB_USER: ${DB_USER:-zcash_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      API_LIST_CACHE_ENABLED: ${API_LIST_CACHE_ENABLED:-0}
      API_CACHE_NAMESPACE: ${API_CACHE_NAMESPACE:-zsa1}
      API_LIST_CACHE_MAX_ENTRIES: ${API_LIST_CACHE_MAX_ENTRIES:-1000}
      ZEBRA_RPC_URL: ${ZEBRA_RPC_URL:-https://rpc.test-zsa.org}
      ZEBRA_GRPC_URL: ""
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3001}:3001"
    networks: [zipherscan]

  # ----- Next.js frontend -----
  web:
    image: ${WEB_IMAGE:-zipherscan-web:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.14.0-bookworm-slim}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        NEXT_PUBLIC_NETWORK: testnet
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_NETWORK: testnet
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side calls inside the compose network:
      ZCASH_RPC_URL: ${ZEBRA_RPC_URL:-https://rpc.test-zsa.org}
      CIPHERSCAN_API_URL: http://api:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [zipherscan]

networks:
  zipherscan:
    driver: bridge

volumes:
  postgres-data:
